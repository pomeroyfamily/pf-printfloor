# PF PrintFloor - Docker Compose for any Linux machine with Docker.
#   docker compose up -d          start (pulls the ready-made image the first time)
#   docker compose pull && docker compose up -d     update - your printers, history and settings are kept
# Then open http://<this machine's IP>:8765
services:
  pf-printfloor:
    image: ghcr.io/pomeroyfamily/pf-printfloor:latest
    container_name: pf-printfloor
    # Host networking lets the dashboard find printers by itself (Bambu SSDP, U1 mDNS, Elegoo UDP broadcasts).
    # Docker Desktop (Windows / Mac): host networking may not work - see "Docker Desktop" in README.md.
    network_mode: host
    environment:
      PRINTER_DASH_PORT: "8765"      # with host networking this is the port on the machine itself
      TZ: America/Los_Angeles        # your time zone (for "done at" times and history)
    volumes:
      - printfloor-data:/data         # everything you set up lives here and survives updates
      # Or keep the data in a folder you choose (easier to back up). Create it first and make it writable by
      # user 568 (the container's user):  sudo mkdir -p /path/to/folder && sudo chown 568:568 /path/to/folder
      # then use this line instead of the one above, and delete the "volumes:" block at the bottom:
      # - /path/to/folder:/data
    restart: unless-stopped

volumes:
  printfloor-data:                    # empty on purpose: a Docker-managed volume with default settings
