# Publishes the ready-made image when a version tag is pushed (e.g. v1.0.0).
# The image is only published if the tests pass AND the built container starts and answers.
name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build for a smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pf-printfloor:smoke
      - name: Smoke test - the container starts, answers and keeps its data in a volume
        run: |
          docker volume create pf-smoke
          docker run -d --name smoke -p 8765:8765 -v pf-smoke:/data pf-printfloor:smoke
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/api/catalog >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/api/catalog >/dev/null
          curl -fsS http://127.0.0.1:8765/ | grep -q "PF PrintFloor"
          docker exec smoke ls /data/dashboard.db
          docker rm -f smoke
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
